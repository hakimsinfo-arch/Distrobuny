# Distro Buny — distribution identification rules
#
# Sections are tried top to bottom; the first section with a matching
# match.* pattern identifies the image, so specific editions come before the
# generic distribution.  Patterns are POSIX extended regular expressions,
# matched case-insensitively against:
#
#   label     ISO 9660 volume label            (e.g. "Kubuntu 26.04.1 LTS amd64")
#   file      ISO file name                    (e.g. "kubuntu-26.04.1-desktop-amd64.iso")
#   info      /.disk/info inside the image     (Ubuntu, Debian, Mint, Pop!_OS, Zorin)
#   treeinfo  "name" from .treeinfo            (Fedora, openSUSE installers)
#   app       ISO application identifier
#   title     first boot-menu entry title
#   folder    folder name ([folder:*] sections only)
#
# Keys:
#   name, variant, icon, vendor, description   display metadata (folder rules
#                                              without "name" keep the user's
#                                              own folder name)
#   version.<src> / variant.<src>              regex; capture group 1 is used
#   rolling = yes                              fall back to the ISO build date as version
#
# Identification only affects naming and icons.  How an image boots is decided
# by the boot adapters from the image's own boot configuration, never from
# these names.

# ---------------------------------------------------------------- Ubuntu family
[kubuntu]
name = Kubuntu
icon = kubuntu
vendor = ubuntu
variant = KDE Plasma
match.label = ^kubuntu
match.file = ^kubuntu-
version.label = ([0-9]{2}\.[0-9]{2}(\.[0-9]+)?( LTS)?)

